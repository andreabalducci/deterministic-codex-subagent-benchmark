services:
  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://db/app
    healthcheck:
      test: ['CMD','curl','-f','http://localhost:3000/health']
  db:
    image: postgres:16.4
    environment: {POSTGRES_DB: app}
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U postgres -d app']
