name: deterministic-verification

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Hidden-suite repetitions for the reference and mutants
        required: true
        default: "20"
        type: number

permissions:
  contents: read

jobs:
  native-matrix:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate workflow input
        env:
          REPEAT: ${{ inputs.repeat }}
        run: python -c "import os; n=int(os.environ['REPEAT']); assert 1 <= n <= 100"
      - name: Verify immutable fixture
        run: python harness.py manifest
      - name: Test harness
        run: python -m unittest discover -s tests -v
      - name: Verify reference and mutants repeatedly
        env:
          REPEAT: ${{ inputs.repeat }}
          OUTPUT: runs/verification-${{ runner.os }}.json
        run: python -c "import os,subprocess; subprocess.check_call(['python','harness.py','verify','--backend','native','--repeat',os.environ['REPEAT'],'--output',os.environ['OUTPUT']])"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: runs/verification-${{ runner.os }}.json

  pinned-container:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate workflow input
        env:
          REPEAT: ${{ inputs.repeat }}
        run: python -c "import os; n=int(os.environ['REPEAT']); assert 1 <= n <= 100"
      - name: Verify through pinned evaluator image
        env:
          REPEAT: ${{ inputs.repeat }}
        run: python -c "import os,subprocess; subprocess.check_call(['python','harness.py','verify','--backend','docker','--repeat',os.environ['REPEAT'],'--output','runs/verification-container.json'])"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-container
          path: runs/verification-container.json
