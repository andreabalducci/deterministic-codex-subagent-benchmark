name: deterministic-verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: Hidden-suite repetitions for the reference and mutants
        required: true
        default: "20"
        type: number

permissions:
  contents: read

jobs:
  routing-readiness:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301
      - name: Validate the routing fixture catalog
        run: python routing_tasks.py catalog-validate
      - name: Calibrate routing evaluators
        run: python routing_tasks.py calibrate --all --backend native
      - name: Validate worker and coordinator protocols
        run: |
          python routing_campaign.py validate
          python coordinator_campaign.py validate
      - name: Verify the generated routing policy
        run: python routing_policy.py --check
      - name: Run the complete Python suite
        run: python -m unittest discover -s tests -v

  required-native:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify immutable fixture
        run: python harness.py manifest
      - name: Test harness
        run: python -m unittest discover -s tests -v
      - name: Verify reference and mutants
        run: python harness.py verify --backend native --repeat 1 --output runs/verification-native.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-native
          path: runs/verification-native.json

  generator-container:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the pinned generator image
        run: docker build --file docker/generator.Dockerfile --tag codex-bench-generator:0.147.0 .
      - name: Probe the generator container without a credential or a model request
        run: python harness.py check-generator --output runs/generator-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: generator-check
          path: runs/generator-check.json
      - name: Check model and effort CLI flag compatibility with the pinned Codex CLI
        run: >-
          python -c "import json,subprocess; matrix=json.load(open('matrix.json'))['configurations'];
          [subprocess.check_call(['docker','run','--rm','codex-bench-generator:0.147.0','codex','exec','--model',row['model'],'--config',f'''model_reasoning_effort=\"{row['reasoningEffort']}\"''','--help']) for row in matrix]"

  native-matrix:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate workflow input
        env:
          REPEAT: ${{ inputs.repeat }}
        run: python -c "import os; n=int(os.environ['REPEAT']); assert 1 <= n <= 100"
      - name: Verify immutable fixture
        run: python harness.py manifest
      - name: Test harness
        run: python -m unittest discover -s tests -v
      - name: Verify reference and mutants repeatedly
        env:
          REPEAT: ${{ inputs.repeat }}
          OUTPUT: runs/verification-${{ runner.os }}.json
        run: python -c "import os,subprocess; subprocess.check_call(['python','harness.py','verify','--backend','native','--repeat',os.environ['REPEAT'],'--output',os.environ['OUTPUT']])"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: runs/verification-${{ runner.os }}.json

  pinned-container:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate workflow input
        env:
          REPEAT: ${{ inputs.repeat }}
        run: python -c "import os; n=int(os.environ['REPEAT']); assert 1 <= n <= 100"
      - name: Verify through pinned evaluator image
        env:
          REPEAT: ${{ inputs.repeat }}
        run: python -c "import os,subprocess; subprocess.check_call(['python','harness.py','verify','--backend','docker','--repeat',os.environ['REPEAT'],'--output','runs/verification-container.json'])"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-container
          path: runs/verification-container.json
